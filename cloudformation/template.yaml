AWSTemplateFormatVersion: '2010-09-09'

Description: >
  OpenMarket Serverless Order Workflow

Resources:

  #################################################
  # Amazon SQS Queue
  #################################################

  OrderQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: openmarket-order-queue

  #################################################
  # IAM Role for Lambda
  #################################################

  AcceptOrderLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: OpenMarket-AcceptOrderLambdaRole

      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:
        - PolicyName: SQSSendMessagePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt OrderQueue.Arn

  #################################################
  # Accept Order Lambda
  #################################################

  AcceptOrderLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: OpenMarket-AcceptOrder

      Runtime: python3.13

      Handler: lambda_function.lambda_handler

      Role: !GetAtt AcceptOrderLambdaRole.Arn

      Code:
        S3Bucket: main-openmarket-serverless-order-workflow
        S3Key: accept-order.zip

      Timeout: 30

      Environment:
        Variables:
          QUEUE_URL: !Ref OrderQueue

  #################################################
  # HTTP API Gateway
  #################################################

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: OpenMarket-OrderAPI
      ProtocolType: HTTP

  #################################################
  # API Gateway Integration
  #################################################

  OrdersIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AcceptOrderLambda.Arn
      PayloadFormatVersion: "2.0"

  #################################################
  # POST /orders Route
  #################################################

  OrdersRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /orders"
      Target: !Join
        - /
        - - integrations
          - !Ref OrdersIntegration

  #################################################
  # Default API Stage
  #################################################

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: "$default"
      AutoDeploy: true

  #################################################
  # Allow API Gateway to Invoke Lambda
  #################################################

  ApiGatewayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AcceptOrderLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*"

Outputs:

  #################################################
  # SQS Outputs
  #################################################

  QueueURL:
    Description: URL of the SQS Queue
    Value: !Ref OrderQueue

  QueueArn:
    Description: ARN of the SQS Queue
    Value: !GetAtt OrderQueue.Arn

  #################################################
  # IAM Output
  #################################################

  LambdaRoleArn:
    Description: IAM Role ARN
    Value: !GetAtt AcceptOrderLambdaRole.Arn

  #################################################
  # Lambda Output
  #################################################

  LambdaFunctionArn:
    Description: AcceptOrder Lambda ARN
    Value: !GetAtt AcceptOrderLambda.Arn

  #################################################
  # API Gateway Output
  #################################################

  ApiEndpoint:
    Description: API Gateway Endpoint
    Value: !GetAtt HttpApi.ApiEndpoint
