AWSTemplateFormatVersion: 2010-09-09
Description: |
  OpenMarket Serverless Order Workflow
Resources:
  OrderQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: openmarket-order-queue
  AcceptOrderLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: OpenMarket-AcceptOrderLambdaRole
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SQSSendMessagePolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: OrderQueue.Arn
  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: OpenMarketOrders
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: OrderId
          AttributeType: S
      KeySchema:
        - AttributeName: OrderId
          KeyType: HASH
  AcceptOrderLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: OpenMarket-AcceptOrder
      Runtime: python3.13
      Handler: lambda_function.lambda_handler
      Role: AcceptOrderLambdaRole.Arn
      Code:
        S3Bucket: main-openmarket-serverless-order-workflow
        S3Key: accept-order.zip
      Timeout: 30
      Environment:
        Variables:
          QUEUE_URL: OrderQueue
  ProcessOrderLambdaRole: null
  Type: AWS::IAM::Role
  Properties:
    RoleName: OpenMarket-ProcessOrderLambdaRole
    AssumeRolePolicyDocument:
      Version: 2012-10-17
      Statement:
        - Effect: Allow
          Principal:
            Service:
              - lambda.amazonaws.com
          Action:
            - sts:AssumeRole
    ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
    Policies:
      - PolicyName: ProcessOrderPolicy
        PolicyDocument:
          Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
              Resource: OrderQueue.Arn
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: OrdersTable.Arn
  ProcessOrderLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: OpenMarket-ProcessOrder
      Runtime: python3.13
      Handler: lambda_function.lambda_handler
      Role: ProcessOrderLambdaRole.Arn
      Code:
        S3Bucket: main-openmarket-serverless-order-workflow
        S3Key: process-order.zip
      Timeout: 30
  ProcessOrderEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 5
      EventSourceArn: OrderQueue.Arn
      FunctionName: ProcessOrderLambda
      Enabled: true
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: OpenMarket-OrderAPI
      ProtocolType: HTTP
  OrdersIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: AcceptOrderLambda.Arn
      PayloadFormatVersion: "2.0"
  OrdersRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: HttpApi
      RouteKey: POST /orders
      Target:
        - /
        - - integrations
          - OrdersIntegration
  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: HttpApi
      StageName: $default
      AutoDeploy: true
  ApiGatewayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: AcceptOrderLambda
      Principal: apigateway.amazonaws.com
      SourceArn: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*
Outputs:
  QueueURL:
    Description: URL of the SQS Queue
    Value: OrderQueue
  QueueArn:
    Description: ARN of the SQS Queue
    Value: OrderQueue.Arn
  LambdaRoleArn:
    Description: IAM Role ARN
    Value: AcceptOrderLambdaRole.Arn
  LambdaFunctionArn:
    Description: AcceptOrder Lambda ARN
    Value: AcceptOrderLambda.Arn
  ApiEndpoint:
    Description: API Gateway Endpoint
    Value: HttpApi.ApiEndpoint
  ProcessOrderLambdaArn:
    Description: ProcessOrder Lambda ARN
    Value: ProcessOrderLambda.Arn
  OrdersTableName:
    Description: DynamoDB Table Name
    Value: OrdersTable
