AWSTemplateFormatVersion: '2010-09-09'

Description: >
  OpenMarket Serverless Order Workflow

Resources:

  #################################################
  # Amazon SQS Queue
  #################################################
  OrderQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: openmarket-order-queue

  #################################################
  # DynamoDB Table
  #################################################
  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: OpenMarketOrders
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: OrderId
          AttributeType: S
      KeySchema:
        - AttributeName: OrderId
          KeyType: HASH

  #################################################
  # IAM Role for AcceptOrder Lambda
  #################################################
  AcceptOrderLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: OpenMarket-AcceptOrderLambdaRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SQSSendMessagePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt OrderQueue.Arn

  #################################################
  # IAM Role for ProcessOrder Lambda
  #################################################
  ProcessOrderLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: OpenMarket-ProcessOrderLambdaRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ProcessOrderPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt OrderQueue.Arn
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !GetAtt OrdersTable.Arn

  #################################################
  # Accept Order Lambda
  #################################################
  AcceptOrderLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: OpenMarket-AcceptOrder
      Runtime: python3.13
      Handler: lambda_function.lambda_handler
      Role: !GetAtt AcceptOrderLambdaRole.Arn
      Code:
        S3Bucket: main-openmarket-serverless-order-workflow
        S3Key: accept-order.zip
      Timeout: 30
      Environment:
        Variables:
          QUEUE_URL: !Ref OrderQueue
          
  #################################################
  # Process Order Lambda
  #################################################
  ProcessOrderLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: OpenMarket-ProcessOrder
      Runtime: python3.13
      Handler: lambda_function.lambda_handler
      Role: !GetAtt ProcessOrderLambdaRole.Arn
      Code:
        S3Bucket: main-openmarket-serverless-order-workflow
        S3Key: process-order.zip
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref OrdersTable

  #################################################
  # SQS Event Source Mapping
  #################################################
  ProcessOrderEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 5
      EventSourceArn: !GetAtt OrderQueue.Arn
      FunctionName: !Ref ProcessOrderLambda
      Enabled: true

  #################################################
  # HTTP API Gateway
  #################################################
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: OpenMarket-OrderAPI
      ProtocolType: HTTP

  #################################################
  # API Gateway Integration
  #################################################
  OrdersIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AcceptOrderLambda.Arn
      PayloadFormatVersion: "2.0"

  #################################################
  # POST /orders Route
  #################################################
  OrdersRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /orders"
      Target: !Join
        - /
        - - integrations
          - !Ref OrdersIntegration

  #################################################
  # Default API Stage
  #################################################
  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: "$default"
      AutoDeploy: true

  #################################################
  # Allow API Gateway to Invoke Lambda
  #################################################
  ApiGatewayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AcceptOrderLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*"

Outputs:

  QueueURL:
    Description: URL of the SQS Queue
    Value: !Ref OrderQueue

  QueueArn:
    Description: ARN of the SQS Queue
    Value: !GetAtt OrderQueue.Arn

  LambdaRoleArn:
    Description: IAM Role ARN
    Value: !GetAtt AcceptOrderLambdaRole.Arn

  LambdaFunctionArn:
    Description: AcceptOrder Lambda ARN
    Value: !GetAtt AcceptOrderLambda.Arn

  ApiEndpoint:
    Description: API Gateway Endpoint
    Value: !GetAtt HttpApi.ApiEndpoint

  ProcessOrderLambdaArn:
    Description: ProcessOrder Lambda ARN
    Value: !GetAtt ProcessOrderLambda.Arn

  OrdersTableName:
    Description: DynamoDB Table Name
    Value: !Ref OrdersTable
